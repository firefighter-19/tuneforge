name: CI

# Triggers:
#   - push на main/master (любые ветки в этих именах, на случай rename)
#   - PR в эти ветки
#   - manual run через "Run workflow" в Actions tab
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # Coloured cargo output — лучше читается в GitHub Actions logs.
  CARGO_TERM_COLOR: always
  # Fail-fast: первая ошибка в любом step-е останавливает job.
  CARGO_INCREMENTAL: 0

# Permissions block: explicit read-only — следуем principle-of-least-privilege.
# Если позже добавим release jobs (cargo-dist и т.п.) — там будут более широкие.
permissions:
  contents: read

jobs:
  # Главный job: build + test всех крейтов в двух feature-конфигурациях.
  # Ubuntu — самый быстрый GitHub runner на free tier (~2x быстрее macOS).
  build-and-test:
    name: Build & test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@v2

      # Системные зависимости на Ubuntu для нашего стэка:
      #   - libusb-1.0-0-dev — rusb (Tactrix transport)
      #   - libudev-dev — serialport (через libudev-sys)
      #   - libxkbcommon-dev, libwayland-dev, libxcb1-dev — winit/eframe bаckends
      #   - libgl1-mesa-dev — glow (OpenGL renderer для egui)
      # На macOS всё из коробки (IOKit + AppKit), отдельный install не нужен.
      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libusb-1.0-0-dev libudev-dev pkg-config \
            libxkbcommon-dev libwayland-dev libxcb1-dev libgl1-mesa-dev

      # Билд с default-features — проверка что без opt-in feature-флагов
      # всё компилируется (важно для license-isolation: GPL-3 kernel-crate
      # не должен быть required).
      - name: Build workspace (default features)
        run: cargo build --workspace --all-targets

      # Билд со всеми feature-флагами — kernel-upload (GPL-3 path) +
      # ecu-tools (GUI dump-rom / DTC / freeze frame modals).
      - name: Build with full features
        run: |
          cargo build --workspace \
            --features tuneforge-cli/kernel-upload,tuneforge-gui/ecu-tools \
            --all-targets

      - name: Run tests
        run: cargo test --workspace

      # Smoke-tests: бинарники должны хотя бы вывести `--help` без падения.
      # Не проверяет hardware-доступ (Tactrix не в CI), только что CLI
      # вообще запускается.
      - name: CLI smoke-test (--help)
        run: |
          cargo run -p tuneforge-cli --quiet -- --help > /dev/null
          cargo run -p tuneforge-cli --quiet --features kernel-upload -- --help > /dev/null

  # Mac build — primary user target (Mac ARM). Линковочный граф отличается
  # от Linux: нет libudev-sys, но есть Cocoa/CoreFoundation крейты через
  # rfd/eframe + IOKit для serialport. macos-latest = ARM (M1+) с 2024.
  # Tactrix usb-driver работает только тут — в Linux нужен ручной udev rule,
  # на Windows — отдельный D2XX-driver, поэтому фокус на mac валидно.
  build-and-test-macos:
    name: Build & test (macOS ARM)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@v2

      # libusb-1.0 на macOS ставится через Homebrew (предустановлен на runner-е).
      # libudev на macOS не нужна — serialport использует IOKit (system framework).
      - name: Install libusb
        run: brew install libusb pkg-config

      - name: Build workspace (default features)
        run: cargo build --workspace --all-targets

      - name: Build with full features
        run: |
          cargo build --workspace \
            --features tuneforge-cli/kernel-upload,tuneforge-gui/ecu-tools \
            --all-targets

      - name: Run tests
        run: cargo test --workspace

      - name: CLI smoke-test (--help)
        run: |
          cargo run -p tuneforge-cli --quiet -- --help > /dev/null
          cargo run -p tuneforge-cli --quiet --features kernel-upload -- --help > /dev/null

  # Lint gate — required. Кодовая база вычищена под `-D warnings` с
  # workspace-уровневой allow-list для pedantic-нюансов нерелевантных
  # к нашему embedded/byte-manipulation domain (см. workspace.lints в
  # корневом Cargo.toml).
  lint:
    name: Clippy & fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust + clippy/rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libusb-1.0-0-dev libudev-dev pkg-config \
            libxkbcommon-dev libwayland-dev libxcb1-dev libgl1-mesa-dev

      # Проверяем обе feature-конфигурации (default + full) — kernel-upload
      # и ecu-tools имеют свой unique-код который иначе пройдёт мимо linter-а.
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (full features)
        run: |
          cargo clippy --workspace --all-targets \
            --features tuneforge-cli/kernel-upload,tuneforge-gui/ecu-tools \
            -- -D warnings

      - name: rustfmt check
        run: cargo fmt --all --check
