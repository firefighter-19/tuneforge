name: CI

# Triggers:
#   - push на main/master (любые ветки в этих именах, на случай rename)
#   - PR в эти ветки
#   - manual run через "Run workflow" в Actions tab
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # Coloured cargo output — лучше читается в GitHub Actions logs.
  CARGO_TERM_COLOR: always
  # Fail-fast: первая ошибка в любом step-е останавливает job.
  CARGO_INCREMENTAL: 0

# Permissions block: explicit read-only — следуем principle-of-least-privilege.
# Если позже добавим release jobs (cargo-dist и т.п.) — там будут более широкие.
permissions:
  contents: read

jobs:
  # Главный job: build + test всех крейтов в двух feature-конфигурациях.
  # Ubuntu — самый быстрый GitHub runner на free tier (~2x быстрее macOS).
  build-and-test:
    name: Build & test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target/
        uses: Swatinem/rust-cache@v2

      # rusb (Tactrix transport) линкуется с системным libusb-1.0.
      # serialport на Linux тянет libudev-sys → нужен libudev-dev.
      # На macOS обе библиотеки есть из коробки; на Ubuntu runner — вручную.
      - name: Install libusb + libudev
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libudev-dev pkg-config

      # Билд с default-features — проверка что без opt-in feature-флагов
      # всё компилируется (важно для license-isolation: GPL-3 kernel-crate
      # не должен быть required).
      - name: Build workspace (default features)
        run: cargo build --workspace --all-targets

      # Билд со всеми feature-флагами — kernel-upload (GPL-3 path) +
      # ecu-tools (GUI dump-rom / DTC / freeze frame modals).
      - name: Build with full features
        run: |
          cargo build --workspace \
            --features romraider-cli/kernel-upload,romraider-gui/ecu-tools \
            --all-targets

      - name: Run tests
        run: cargo test --workspace

      # Smoke-tests: бинарники должны хотя бы вывести `--help` без падения.
      # Не проверяет hardware-доступ (Tactrix не в CI), только что CLI
      # вообще запускается.
      - name: CLI smoke-test (--help)
        run: |
          cargo run -p romraider-cli --quiet -- --help > /dev/null
          cargo run -p romraider-cli --quiet --features kernel-upload -- --help > /dev/null

  # Lint gate — required. Кодовая база вычищена под `-D warnings` с
  # workspace-уровневой allow-list для pedantic-нюансов нерелевантных
  # к нашему embedded/byte-manipulation domain (см. workspace.lints в
  # корневом Cargo.toml).
  lint:
    name: Clippy & fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust + clippy/rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install libusb + libudev
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev pkg-config

      # Проверяем обе feature-конфигурации (default + full) — kernel-upload
      # и ecu-tools имеют свой unique-код который иначе пройдёт мимо linter-а.
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (full features)
        run: |
          cargo clippy --workspace --all-targets \
            --features romraider-cli/kernel-upload,romraider-gui/ecu-tools \
            -- -D warnings

      - name: rustfmt check
        run: cargo fmt --all --check
