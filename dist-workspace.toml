[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Installers — shell-скрипт даёт universal `curl ... | sh` команду.
# Homebrew tap отложен до отдельного `homebrew-tap` репо (см. v0.5.0+).
installers = ["shell"]
# Target platforms: только Mac. Tactrix-стек на Linux требует libusb +
# udev rules + (для GUI) X11/Wayland libs — overhead не оправдан без
# реальной Linux-аудитории. Windows скип — нет нативного USB-драйвера
# (Tactrix на Win требует свой D2XX/MS Visual C++ runtime).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
