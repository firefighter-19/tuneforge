[workspace]
resolver = "2"
members = [
    "crates/tuneforge-core",
    "crates/tuneforge-io",
    "crates/tuneforge-protocol",
    "crates/tuneforge-defs",
    "crates/tuneforge-rom",
    "crates/tuneforge-logger",
    "crates/tuneforge-cli",
    "crates/tuneforge-gui",
    # Slice 21: kernel-upload path для Subaru SH7055/SH7058 ROM dump.
    # Лицензирован под GPL-3.0-or-later (отдельно от workspace default), потому
    # что прямой port из GPL-3.0 апстрима (fenugrec/nisprog, fenugrec/npkern).
    "crates/tuneforge-kernel",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.78"
license = "GPL-2.0-or-later"
authors = ["tuneforge contributors"]
repository = "https://github.com/firefighter-19/tuneforge"
homepage = "https://github.com/firefighter-19/tuneforge"
# `readme` ссылается на workspace-level README; путь резолвится относительно
# manifest-а каждого крейта (т.е. для `crates/tuneforge-cli/Cargo.toml` это
# `crates/tuneforge-cli/../../README.md` = корневой README).
readme = "../../README.md"
# Keywords/categories из официальных списков crates.io — нужны для
# поиска и rendering-а на сайте если когда-то опубликуем.
keywords = ["subaru", "ecu", "tuning", "tactrix", "automotive"]
categories = ["hardware-support"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
# `unreachable_pub` — pedantic нюанс «pub(crate) вместо pub». Не indicate
# реальной проблемы в нашем многокрейтовом workspace-е.
unreachable_pub = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Стилевые предпочтения — keep warn так как auto-fixable и легко решается.
module_name_repetitions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"

# ── Allow-list для embedded/byte-manipulating domain ─────────────────
# Наш код активно crunch-ит bytes (CAN frames, ROM-data, SSM-protocols),
# где `u8 as f64` / `len() as u32` / `usize as u16` — нормальные паттерны
# а не bugs. По дефолту clippy::pedantic это flag-ит как warnings —
# disable-им чтобы шум не мешал реальным issue.
cast_lossless            = "allow"  # u8 → f64 в scaling-формулах
cast_possible_truncation = "allow"  # len() as u32 для CAN-length полей
cast_precision_loss      = "allow"  # usize → f64 для elapsed.as_secs_f64()
cast_sign_loss           = "allow"  # i32 → u32 в bit-manipulation
cast_possible_wrap       = "allow"  # i64 → i32 для percentage calcs

# Стилевые pedantic-нюансы которые мы не enforces:
doc_markdown          = "allow"  # «backticks around DTC» в комментариях
uninlined_format_args = "allow"  # `format!("{}", x)` vs `format!("{x}")`
unreadable_literal    = "allow"  # `0xFFFF7664` без `_` separator
too_many_arguments    = "allow"  # CLI commands с 8 параметрами OK
needless_pass_by_value = "allow"  # часто намеренно для clarity
items_after_statements = "allow"  # `const` inside fn в middle — OK
single_match_else     = "allow"  # match c одной arm + else иногда чище if-let
if_not_else           = "allow"  # `if !cond { } else { }` читается нормально
similar_names         = "allow"  # u8/u16 переменные часто similar по имени

# Дополнительные стилевые pedantic-нюансы:
assigning_clones                = "allow"  # `x = y.clone()` — иногда intentional паттерн
float_cmp                       = "allow"  # `assert_eq!(x, 1.5)` в tests с literal values OK
inline_always                   = "allow"  # `#[inline(always)]` на hot Feistel rounds — programmer override
too_many_lines                  = "allow"  # large CLI handlers и UI render-functions OK
ptr_arg                         = "allow"  # `&PathBuf` vs `&Path` — minor, не perf-critical
format_push_string              = "allow"  # `s.push_str(&format!(...))` сейчас читается лучше чем write!()
trivially_copy_pass_by_ref      = "allow"  # `&u8` vs `u8` — fine if API consistency
unnecessary_debug_formatting    = "allow"  # `panic!("got {x:?}")` иногда полезнее `{x}`
return_self_not_must_use        = "allow"  # builder pattern методы OK без `#[must_use]`

# Финальные «стилевые suggestions» — мнения о форме кода, не о корректности:
manual_let_else                 = "allow"  # `if let Some(_) = ... else {}` иногда читается яснее
match_same_arms                 = "allow"  # одинаковые тела arms могут быть intentional для clarity
unnecessary_wraps               = "allow"  # `Result<T, !>` сейчас Ok-only но интерфейс для будущего
needless_lifetimes              = "allow"  # explicit lifetimes часто полезны для документации
struct_excessive_bools          = "allow"  # state-флаги в UI-panel-ах легитимны
naive_bytecount                 = "allow"  # `bytes.iter().filter(|b| **b == X).count()` ясен
single_char_pattern             = "allow"  # `match c { 'a' => ... }` норма
many_single_char_names          = "allow"  # CSS-style scoped к одному блоку
unused_self                     = "allow"  # method-receiver consistency бывает важна
mixed_attributes_style          = "allow"  # `#[doc] #[allow]` группы OK
useless_let_if_seq              = "allow"  # readability over conciseness

# Финальный residual — pedantic suggestions без actionable value:
unusual_byte_groupings          = "allow"  # `0x14457AA350` Subaru part number — single group OK
elidable_lifetime_names         = "allow"  # `&'a Foo<'a>` иногда нужно для clarity
doc_lazy_continuation           = "allow"  # markdown list-items в comments — minor
needless_continue               = "allow"  # `continue;` в конце loop arm — sometimes explicit
needless_range_loop             = "allow"  # `for i in 0..N { arr[i] }` явнее чем `iter()` в crypto loops
vec_init_then_push              = "allow"  # `let mut v = Vec::new(); v.push(...)` vs `vec![...]`
incompatible_msrv               = "allow"  # accept newer stdlib methods, bumping MSRV when needed

[workspace.dependencies]
# Internal crates — keep paths so a single `cargo build` builds the whole tree.
tuneforge-core     = { path = "crates/tuneforge-core" }
tuneforge-io       = { path = "crates/tuneforge-io" }
tuneforge-protocol = { path = "crates/tuneforge-protocol" }
tuneforge-defs     = { path = "crates/tuneforge-defs" }
tuneforge-rom      = { path = "crates/tuneforge-rom" }
tuneforge-logger   = { path = "crates/tuneforge-logger" }
tuneforge-kernel   = { path = "crates/tuneforge-kernel" }

# Errors / logging
thiserror   = "2"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization / parsing
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
quick-xml   = { version = "0.36", features = ["serialize"] }
nom         = "7"
binrw       = "0.14"
byteorder   = "1"
hex         = "0.4"

# Async / time
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
futures     = "0.3"

# Hardware I/O
serialport  = "4"
libloading  = "0.8"
rusb        = "0.9"

# Math
nalgebra    = "0.33"
meval       = "0.2"

# CLI
clap        = { version = "4", features = ["derive"] }

# GUI
# eframe c `default-features = false` отключает в т.ч. linux-бэкенды winit-а.
# `wayland`+`x11` обязательны иначе на Ubuntu CI получаем compile_error из
# `winit/platform_impl/mod.rs` ("The platform you're compiling for is not supported by winit").
# На macOS используется AppKit-бэкенд независимо от этих фич.
eframe      = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui        = "0.30"
egui_extras = { version = "0.30", features = ["all_loaders"] }
egui_plot   = "0.30"
rfd         = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[profile.release]
lto         = "thin"
codegen-units = 1
strip       = "symbols"

[profile.release-debug]
inherits    = "release"
debug       = true
strip       = "none"
