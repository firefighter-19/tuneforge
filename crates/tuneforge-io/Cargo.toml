[package]
name        = "tuneforge-io"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
description = "Hardware transports (serial, J2534, ELM327) for tuneforge"

[lints]
workspace = true

[dependencies]
tuneforge-core = { workspace = true }

thiserror  = { workspace = true }
tracing    = { workspace = true }
serialport = { workspace = true }
rusb       = { workspace = true, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
libloading = { workspace = true }

[features]
default = ["serial"]
serial  = []
elm327  = ["serial"]
j2534   = []
mock    = []
# Tactrix Openport 2.0 USB-bulk transport (libusb через rusb).
# Требует системную libusb-1.0; на macOS: `brew install libusb`.
tactrix = ["dep:rusb"]
