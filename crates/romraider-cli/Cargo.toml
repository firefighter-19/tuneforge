[package]
name        = "romraider-cli"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
description = "Headless CLI for romraider-rs (debug I/O, dump ROM, smoke test logger)"

[lints]
workspace = true

[[bin]]
name = "romraider"
path = "src/main.rs"

[dependencies]
romraider-core     = { workspace = true }
romraider-defs     = { workspace = true }
romraider-io       = { workspace = true, features = ["serial", "tactrix"] }
romraider-protocol = { workspace = true, features = ["ssm"] }
romraider-rom      = { workspace = true }
romraider-logger   = { workspace = true }
# Kernel-upload путь для дампа ROM — GPL-3.0, opt-in через `--features kernel-upload`.
romraider-kernel   = { workspace = true, optional = true }

clap     = { workspace = true }
anyhow   = { workspace = true }
tracing  = { workspace = true }
tracing-subscriber = { workspace = true }
serialport = { workspace = true }

[features]
default = []
# Подключает `romraider-kernel` (GPL-3.0) и добавляет `dump-rom-kernel` subcommand.
# Когда феча выключена, CLI остаётся "чистым" — kernel-upload даже не компилируется.
kernel-upload = ["dep:romraider-kernel", "romraider-kernel/sh7058", "romraider-kernel/sh7055"]
